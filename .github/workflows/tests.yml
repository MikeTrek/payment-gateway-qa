name: Solidgate Payment Tests

on:
  push:
    branches: [ core-assignment ]
  pull_request:
    branches: [ core-assignment ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Checkstyle validation
        run: ./mvnw checkstyle:check -q

      - name: Run tests
        run: ./mvnw clean test -Dbrowser.headless=true
        env:
          SOLIDGATE_PUBLIC_KEY: ${{ secrets.SOLIDGATE_PUBLIC_KEY }}
          SOLIDGATE_SECRET_KEY: ${{ secrets.SOLIDGATE_SECRET_KEY }}

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
