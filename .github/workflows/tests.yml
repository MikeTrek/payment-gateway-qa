name: Solidgate Payment Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Checkstyle validation
        run: ./mvnw checkstyle:check -q

      - name: Run API tests
        run: ./mvnw clean test -DexcludedGroups=ui,quarantine
        env:
          SOLIDGATE_PUBLIC_KEY: ${{ secrets.SOLIDGATE_PUBLIC_KEY }}
          SOLIDGATE_SECRET_KEY: ${{ secrets.SOLIDGATE_SECRET_KEY }}

      - name: Run UI tests
        if: always()
        timeout-minutes: 8
        run: ./mvnw test -Dgroups=ui -DexcludedGroups=quarantine -Dbrowser.headless=true
        env:
          SOLIDGATE_PUBLIC_KEY: ${{ secrets.SOLIDGATE_PUBLIC_KEY }}
          SOLIDGATE_SECRET_KEY: ${{ secrets.SOLIDGATE_SECRET_KEY }}

      - name: Run quarantine tests (non-gating)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: ./mvnw test -Dgroups=quarantine -DexcludedGroups= -Dbrowser.headless=true
        env:
          SOLIDGATE_PUBLIC_KEY: ${{ secrets.SOLIDGATE_PUBLIC_KEY }}
          SOLIDGATE_SECRET_KEY: ${{ secrets.SOLIDGATE_SECRET_KEY }}

      # Proves the Testcontainers path in ContainerBrowserFactory actually works —
      # not just that it compiles. Non-gating: ubuntu-latest ships Docker, but a
      # reviewer's machine might not, and this option is opt-in by design.
      - name: Testcontainers smoke check (non-gating)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: ./mvnw test -Dtest=PaymentUiTest#shouldCompleteVisaPaymentAndVerifyStatus -Duse.testcontainers=true -Dbrowser.headless=true
        env:
          SOLIDGATE_PUBLIC_KEY: ${{ secrets.SOLIDGATE_PUBLIC_KEY }}
          SOLIDGATE_SECRET_KEY: ${{ secrets.SOLIDGATE_SECRET_KEY }}

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz

      - name: Load Allure history from gh-pages
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null && \
          git checkout origin/gh-pages -- history 2>/dev/null && \
          mkdir -p target/allure-results/history && \
          cp -r history/* target/allure-results/history/ || true

      - name: Generate Allure report
        if: always()
        run: ./allure-2.29.0/bin/allure generate target/allure-results -o allure-report --clean

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
