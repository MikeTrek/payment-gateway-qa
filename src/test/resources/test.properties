# Solidgate API credentials — override via env: SOLIDGATE_PUBLIC_KEY / SOLIDGATE_SECRET_KEY
# ConfigProvider maps UPPER_SNAKE env vars to dotted keys.
solidgate.public.key=
solidgate.secret.key=

# Base URLs
solidgate.payment.page.url=https://payment-page.solidgate.com/api/v1
solidgate.pay.url=https://pay.solidgate.com/api/v1

# Browser
browser=chrome
browser.headless=true
browser.timeout=15000

# Timeouts (seconds)
page.load.timeout=30
payment.result.timeout=60
status.poll.interval=3
status.poll.timeout=60
